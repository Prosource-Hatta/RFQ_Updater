<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generic Templates</title>
  <link rel="stylesheet" href="taskpane.css" />
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script type="module" src="taskpane.js"></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Reply-All Drafts</h1>
      <div class="field">
        <label for="referenceInput">Reference Code (optional)</label>
        <input id="referenceInput" type="text" placeholder="e.g. REF-123" />
      </div>
      <div class="field">
        <label for="templateSelect">Template</label>
        <select id="templateSelect"></select>
      </div>
      <button id="createDraftsBtn" class="primary">Create Drafts</button>
      <p id="statusArea" class="status" role="status"></p>
    </section>

    <section class="card">
      <header class="card-header">
        <h2>Mail Templates</h2>
        <button id="toggleTemplateFormBtn" class="link">Add New</button>
      </header>
      <form id="templateForm" class="hidden">
        <div class="field">
          <label for="templateNameInput">Template Name</label>
          <input id="templateNameInput" type="text" required />
        </div>
        <div class="field">
          <label for="templateBodyInput">Template Body (HTML allowed)</label>
          <textarea id="templateBodyInput" rows="5" required></textarea>
        </div>
        <button type="submit" class="primary">Save Template</button>
        <button type="button" id="cancelTemplateBtn" class="secondary">Cancel</button>
      </form>
      <ul id="templateList" class="item-list"></ul>
    </section>

    <section class="card">
      <header class="card-header">
        <h2>Team Mail IDs</h2>
        <form id="teamForm" class="inline-form">
          <input id="teamEmailInput" type="email" placeholder="team@example.com" />
          <button type="submit" class="secondary">Add</button>
        </form>
      </header>
      <ul id="teamList" class="item-list"></ul>
    </section>
  </main>
</body>
</html>
